name: Test

on:
  push:
    branches: [main]
  pull_request:


permissions:
  contents: read
  checks: write
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # pnpm/action-setup@v4
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        name: Install pnpm
        with:
          version: 10.33.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Check release config
        run: pnpm release:check

      - name: Run linter
        run: pnpm lint

      - name: Check public API docs
        run: pnpm docs:check

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      # Fail-only check on the PR merge commit, so a bundle that the merge with
      # main makes stale cannot go green. action-bundle below fixes the branch.
      - name: Check GitHub Action bundle on the merge result
        run: sh scripts/check-action-bundle.sh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: ./coverage/
          flags: unittests
          name: codecov-unittests
          fail_ci_if_error: false

      - name: Upload results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@cf701569b05ccdd861a76b8607a66d76f6fd4857
        if: ${{ !cancelled() }}
        with:
          report_paths: "**/*.junit.xml"
          comment: false

  # Keeps the committed Action bundle fresh. This job builds with no write
  # token. On same-repo PRs a stale bundle goes to push-action-bundle, which
  # installs nothing and pushes with the release bot token so CI runs again.
  # Fork PRs, Dependabot, and main cannot be pushed to here, so they fail.
  action-bundle:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    env:
      CAN_PUSH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # pnpm/action-setup@v4
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        name: Install pnpm
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Check GitHub Action bundle
        id: check
        run: sh scripts/check-action-bundle.sh

      - name: Upload rebuilt GitHub Action bundle
        if: steps.check.outputs.stale == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: action-bundle
          path: github-reporter/dist
          retention-days: 1

  push-action-bundle:
    needs: action-bundle
    if: needs.action-bundle.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.token.outputs.token }}

      - name: Download rebuilt GitHub Action bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: action-bundle
          path: ${{ runner.temp }}/action-bundle

      - name: Push GitHub Action bundle
        env:
          PUSH_BRANCH: ${{ github.head_ref }}
          GIT_AUTHOR_NAME: ${{ steps.token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: sh scripts/push-action-bundle.sh "$RUNNER_TEMP/action-bundle"
