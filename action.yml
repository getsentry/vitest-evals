name: "vitest-evals GitHub Reporter"
description: "Publish vitest-evals results to GitHub Actions summaries, annotations, and checks"
author: "Functional Software, Inc."

branding:
  icon: "check-circle"
  color: "green"

inputs:
  results:
    description: "Vitest JSON result files to report. Supports paths, * and ** globs, and newline-separated entries."
    required: false
    default: "vitest-results.json"
  publish-summary:
    description: "Write a GitHub Actions job summary."
    required: false
    default: "true"
  publish-annotations:
    description: "Emit GitHub workflow annotations for failed evals."
    required: false
    default: "true"
  publish-check:
    description: "Publish one GitHub Check Run for the combined report. On pull_request, attaches to the PR head SHA (not the temporary merge commit) so the check shows on the PR."
    required: false
    default: "false"
  check-name:
    description: "Name of the GitHub Check Run."
    required: false
    default: "vitest-evals"
  github-token:
    description: "GitHub token used for Check Run publishing."
    required: false
    default: "${{ github.token }}"
  sha:
    description: "Commit SHA for the Check Run. Defaults to pull_request.head.sha on pull_request events, otherwise GITHUB_SHA."
    required: false
  fail-on-failures:
    description: "Fail the action when any eval case failed. Equivalent to min-pass-rate: 1."
    required: false
    default: "false"
  soft-fail:
    description: "When true, keep this step green on a failed gate so a published Check Run owns PR status. Defaults to true only when a Check Run is published successfully."
    required: false
  min-pass-rate:
    description: "Minimum fraction of eval cases that must pass (0-1). Example: 0.8 requires an 80% pass rate."
    required: false
  min-score-average:
    description: "Minimum average eval score across scored cases (0-1)."
    required: false
  max-annotations:
    description: "Maximum number of failure annotations to publish. Check Run annotations are capped at 50."
    required: false
  max-failures:
    description: "Maximum number of detailed failures to include in summaries and checks."
    required: false

outputs:
  status:
    description: "Effective CI status: passed or failed. Follows the configured gate when set; otherwise mirrors the raw report."
  results-count:
    description: "Number of Vitest JSON result files included."
  evals-total:
    description: "Total eval cases included in the report."
  evals-passed:
    description: "Passed eval cases included in the report."
  evals-failed:
    description: "Failed eval cases included in the report."
  pass-rate:
    description: "Eval pass rate as a 0-1 ratio (for example 0.80), or n/a."
  score-average:
    description: "Average eval score across the combined report."
  score-minimum:
    description: "Minimum eval score across the combined report."
  gate-status:
    description: "Same value as status. Kept for explicit gate wiring."
  gate-title:
    description: "Short gate title used for Check Runs and suite-level annotations."
  gate-message:
    description: "Human-readable gate decision message."
  check-url:
    description: "URL of the published GitHub Check Run, when available."

runs:
  using: "node24"
  main: "github-reporter/dist/action/index.js"
